spring:
  application:
    name: api-gateway
  threads:
    virtual:
      enabled: true
  http:
    clients:
      connect-timeout: 2s
      read-timeout: 10s
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth
              uri: ${AUTH_URI:http://localhost:8100}
              predicates:
                - Path=/api/auth/**,/.well-known/jwks.json
            - id: postcodes
              uri: ${POSTCODES_URI:http://localhost:8200}
              predicates:
                - Path=/api/postcodes/**

server:
  port: 8765

management:
  otlp:
    metrics:
      export:
        enabled: false
